[package]
name = "scheck"
version = "0.2.0"
edition = "2024"
description = "Semantic validation of structured data using assertion-based rules"
license = "MIT"
repository = "https://github.com/rh-jfuller/scheck"
readme = "README.md"
keywords = ["validation", "semantic", "json", "yaml", "jsonpath"]
categories = ["command-line-utilities", "parser-implementations", "encoding"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
name = "scheck"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "scheck"
path = "src/main.rs"

[features]
default = ["cli"]
cli = ["dep:clap"]
wasm = ["dep:wasm-bindgen"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
regex = "1"
roxmltree = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_path = "0.7"
serde_yml = "0.0.12"
thiserror = "2"
txt2data = { version = "0.6", default-features = false }
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.release-wasm]
inherits = "release"
opt-level = "s"
